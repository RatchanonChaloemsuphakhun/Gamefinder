<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameFinder</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search,menu,add,favorite,close"
    >
</head>

<body>
    <header class="topbar">
        <button id="menuBtn" class="menuBtn material-symbols-outlined">menu</button>
        <h1>GameFinder</h1>
        <button id="addBtn" class="addBtn material-symbols-outlined">add</button>
    </header>

    <hr>
    <main>
        <div id="sidebar" class="sidebar">
            <button id="closeBtn" class="closeBtn material-symbols-outlined">close</button>
            <nav aria-label="Game genres">
                <h2 class="sidebar__heading">Genres</h2>
                <ul id="genreList" class="sidebar__genre-list"></ul>
            </nav>
        </div>

        <div id="overlay" class="overlay"></div>

        <article id="searchbar">
            <h1>What Genre</h1>
            <form>
                <div class="search">
                    <span class="search-icon material-symbols-outlined">search</span>
                    <input class="search-input" type="search" placeholder="Seach">
                </div>
            </form>
            <br>
            <button id="submitBtn">Submit</button>
        </article>

        <div id="sort">
            <label for="sort">sort by:</label>
            <select name="sort-list" id="list">
                <option value="" selected>-- please select --</option>
                <option value="price">Price</option>
                <option value="playtime">Playtime</option>
            </select>
        </div>

        <div id="gamelist">
            <ul id="gamelist-ul" class="gamelist"></ul>
        </div>

        <dialog id="unfavoriteDialog" class="confirm-dialog">
            <h2 id="unfavoriteTitle">Remove game?</h2>
            <p>Are you sure you want to remove <strong id="unfavoriteGameName"></strong> from your list?</p>
            <div class="confirm-dialog__actions">
                <button id="cancelUnfavorite" class="confirm-dialog__cancel" type="button">Cancel</button>
                <button id="confirmUnfavorite" class="confirm-dialog__remove" type="button">Remove game</button>
            </div>
        </dialog>

        <dialog id="addGameDialog" class="game-form-dialog" aria-labelledby="addGameTitle">
            <form id="addGameForm" class="game-form">
                <h2 id="addGameTitle">Add a game</h2>
                <label for="newGameName">Game name</label>
                <input id="newGameName" name="name" type="text" required>

                <label for="newGameGenres">Genres (separate with commas)</label>
                <input id="newGameGenres" name="genres" type="text" placeholder="RPG, Action" required>

                <label for="newGamePrice">Price in Thai baht</label>
                <input id="newGamePrice" name="price" type="number" min="0" step="0.01" required>

                <label for="newGamePlaytime">Playtime in hours</label>
                <input id="newGamePlaytime" name="playtime" type="number" min="0" step="0.1" required>

                <div class="game-form__actions">
                    <button id="cancelAddGame" class="game-form__cancel" type="button">Cancel</button>
                    <button class="game-form__submit" type="submit">Add game</button>
                </div>
            </form>
        </dialog>
    </main>

    <footer></footer>
    <script src="script.js"></script>

</body>

</html>
